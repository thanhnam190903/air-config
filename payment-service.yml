spring:
 
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db
    username: root
    password: root
  
  kafka:
    bootstrap-servers: localhost:9092


razorpay:
  api:
    key: ${RAZORPAY_KEY}
    secret: ${RAZORPAY_SECRET}
  callback:
    base-url: http://localhost:5173

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

server:
  port: 8010